{% load static %}<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cửa hàng Xanh{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'shop:home' %}">Cửa hàng Xanh</a>
    <a class="cart-link" href="/gio-hang/">Giỏ hàng ({{ cart_count }})</a>
  </header>
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
